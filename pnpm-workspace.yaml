minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  # First publish of the Oxlint flat-config toolkit; required by @liangmi/vp-config.
  - '@oxlint-flat-config/composer@0.3.1'
  - oxlint-flat-config@0.4.0
  - '@liangmi/vp-config@1.0.0'

shellEmulator: true

packages:
  - .

overrides:
  # cssnano 9 dropped the staged-publish evidence required by trustPolicy.
  # Keep Nuxt 4.6.1 while retaining the previously trusted CSS minifier.
  '@nuxt/vite-builder@4.6.1>cssnano': 8.0.10
  # Keep the versions already locked on main.
  vue: 3.5.43
  vue-i18n: 11.4.12
  nitropack: 2.13.4
  '@nuxt/cli': 4.0.1
  '@nuxt/devtools': 3.4.3
  '@nuxt/kit@4.6.4': 4.6.1
  '@nuxt/schema@4.6.4': 4.6.1
  vite@*: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest@*: 5.0.5

allowBuilds:
  '@takumi-rs/core': true
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

catalogs:
  dev:
    '@liangmi/vp-config': 1.0.0
    # ESLint used to bring this in. nuxt typecheck still needs it, including vendor/ui.
    '@types/node': 26.6.2
    cf: 1.0.0-beta.12
    lint-staged: ^16.1.6
    # Keep the versions already locked on main.
    nuxtseo-devtools-host: 1.0.2
    simple-git-hooks: ^2.14.0
    typescript: ~5.9.3
    vite-plus: 1.3.0
    vue-tsc: 3.3.11
    wrangler: 4.144.0
  prod:
    '@fontsource-variable/geist': ^5.3.0
    '@fontsource-variable/geist-mono': ^5.3.0
    '@fontsource/instrument-serif': ^5.3.0
    '@froq/og-covers-layer': github:0froq/og-layer#v0.2.1
    # content and nuxt stay on the versions already locked on main.
    '@nuxt/content': 3.16.1
    '@nuxtjs/i18n': ^10.6.0
    nuxt: 4.6.1
    vue: ^3.5.43
    zod: ^4.6.6
